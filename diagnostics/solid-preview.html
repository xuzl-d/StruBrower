<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>圆角盒 / 无人机几何预览</title>
  <style>
    body { margin: 0; background: #10151c; display: flex; flex-wrap: wrap; }
    figure { margin: 0; position: relative; }
    figcaption { position: absolute; left: 10px; top: 8px; color: #9fb6cf; font: 13px/1.4 -apple-system, sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
<div id="root" style="display:flex;flex-wrap:wrap"></div>
<script type="module">
  import * as THREE from 'three';
  import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
  import { buildSolidModel } from '/src/bim/solid.ts';
  import { libraryFeatures } from '/shared/library.js';

  const cases = [
    {
      title: '薄板 200×160×6，倒圆 20（顶盖典型）',
      features: [{ id: 'p', shape: { shape: 'roundedBox', width: 0.2, depth: 0.16, height: 0.006, radius: 0.02, segments: 48 } }],
      camera: [0.28, -0.3, 0.22],
    },
    {
      title: '机身 260×180×50，倒圆 14（模板参数）',
      features: [{ id: 'b', shape: { shape: 'roundedBox', width: 0.26, depth: 0.18, height: 0.05, radius: 0.014, segments: 48 } }],
      camera: [0.34, -0.36, 0.26],
    },
    {
      title: '薄板俯视（检查平面圆角是否真的圆角矩形）',
      features: [{ id: 'p2', shape: { shape: 'roundedBox', width: 0.2, depth: 0.16, height: 0.006, radius: 0.02, segments: 48 } }],
      camera: [0.0001, 0.0001, 1],
    },
    {
      title: '无人机（模板 31 特征 + 逐零件材质）',
      features: libraryFeatures('quadcopter'),
      camera: [1.0, -1.05, 0.72],
      zoom: 2.7,
    },
  ];

  const W = 620;
  const H = 460;

  for (const item of cases) {
    const figure = document.createElement('figure');
    const caption = document.createElement('figcaption');
    caption.textContent = item.title;
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    figure.append(canvas, caption);
    document.getElementById('root').append(figure);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.setClearColor(0x10151c, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 1.0;
    pmrem.dispose();
    const camera = new THREE.PerspectiveCamera(30, W / H, 0.005, 100);

    const model = buildSolidModel(item.features);
    const geometry = model.geometry;
    geometry.computeBoundingSphere();
    const sphere = geometry.boundingSphere;
    const fallback = { color: 0x8fb9e8, roughness: 0.42, metalness: 0.25 };
    const materials = model.materials.length
      ? model.materials.map((entry) => new THREE.MeshStandardMaterial({
        color: entry?.color ?? '#8fb9e8',
        roughness: entry?.roughness ?? fallback.roughness,
        metalness: entry?.metalness ?? fallback.metalness,
        transparent: (entry?.opacity ?? 100) < 100,
        opacity: (entry?.opacity ?? 100) / 100,
      }))
      : [new THREE.MeshStandardMaterial(fallback)];
    const mesh = new THREE.Mesh(geometry, materials.length > 1 ? materials : materials[0]);
    scene.add(mesh);

    // 网格线：一眼看出曲面是否被平面化
    

    const gridSize = Math.max(0.12, Math.round(((sphere?.radius ?? 0.3) * 2.4) * 20) / 20);
    const grid = new THREE.GridHelper(gridSize, Math.max(4, Math.round(gridSize / 0.05)), 0x22303f, 0x1a242f);
    grid.position.y = -0.01;
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    const key = new THREE.DirectionalLight(0xffffff, 1.5);
    key.position.set(0.8, -0.9, 1.4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x9dc6ff, 0.4);
    fill.position.set(-1.0, 0.6, 0.5);
    scene.add(fill);
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));

    const dir = new THREE.Vector3(...item.camera).normalize();
    const focus = sphere?.center ?? new THREE.Vector3();
    camera.position.copy(focus).addScaledVector(dir, (sphere?.radius ?? 0.3) * (item.zoom ?? 4.2));
    camera.lookAt(focus);

    renderer.render(scene, camera);
    geometry.dispose();
  }
  window.__ready = true;
</script>
</body>
</html>
